<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Turn · Free Preview · Dr. Rod Berger</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="The free preview of The Turn with Dr. Rod Berger: Start Here, the Quick Check and Lessons 1 to 3.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a course player. A course progress meter rides in the header on every page. Outline of lessons on the left (a drawer on phones) with per-item checks and per-lesson status; the main column shows Start Here, the course dashboard, a lesson's pieces in viewing order, or a lesson-complete screen. Tokens are The Turn kit's own. */
:root{
  --bg:#F4F2EC; --surface:#FBFAF6; --ink:#183048; --muted:#5d6b78; --line:#dcd7cb;
  --coral:#FF7559; --coral-ink:#c4472d; --ok:#2e7d5b; --ok-soft:rgba(46,125,91,.12); --veil:rgba(24,48,72,.06);
  --display:"Cormorant Garamond", Georgia, serif;
  --body:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1d2b; --surface:#16283a; --ink:#F4F2EC; --muted:#a9b4bf; --line:#2a4157;
  --coral:#FF7559; --coral-ink:#ff9a83; --ok:#6fcf9f; --ok-soft:rgba(111,207,159,.14); --veil:rgba(244,242,236,.06); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1d2b; --surface:#16283a; --ink:#F4F2EC; --muted:#a9b4bf; --line:#2a4157;
  --coral:#FF7559; --coral-ink:#ff9a83; --ok:#6fcf9f; --ok-soft:rgba(111,207,159,.14); --veil:rgba(244,242,236,.06); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--coral-ink)}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:14px}
.brand{font-family:var(--display);font-weight:600;font-size:1.7rem;line-height:1;background:none;border:0;padding:0}
.brand small{font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;color:var(--coral-ink);text-transform:uppercase;margin-left:8px;vertical-align:middle}
.spacer{flex:1}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-size:.9rem}
.toggle{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.toggle input{accent-color:var(--coral)}
.flag{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 10px;white-space:nowrap}

/* course progress meter, always in the header */
.prog{display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);border-radius:99px;padding:5px 12px 5px 10px;min-width:0}
.prog .pl{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bar{display:block;height:6px;border-radius:99px;background:var(--line);overflow:hidden;flex:0 0 auto}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .4s}
.prog .bar{width:90px}
.prog b{font-size:.85rem;font-variant-numeric:tabular-nums}

.shell{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 64px}
nav.outline{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);align-self:start;max-height:calc(100vh - 90px);overflow:auto;padding-right:4px}
.les{border-bottom:1px solid var(--line)}
.les>button{width:100%;text-align:left;background:none;border:0;padding:11px 4px;display:grid;grid-template-columns:2.2rem 1fr auto;gap:6px;align-items:center}
.les .no{font-family:var(--mono);font-size:.72rem;color:var(--muted);width:1.7rem;height:1.7rem;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid transparent}
.les.complete .no{background:var(--ok);color:var(--bg);border-color:var(--ok);font-size:.8rem}
.les .nm{font-weight:600;font-size:.95rem;line-height:1.3}
.les .ct{font-family:var(--mono);font-size:.68rem;color:var(--muted);white-space:nowrap}
.les.complete .ct{color:var(--ok)}
.les.open>button .nm{color:var(--coral-ink)}
.les.locked>button{opacity:.55}
.les.bonus>button .nm{color:var(--coral-ink)}
.bonus-pill{display:inline-block;font-family:var(--mono);font-size:.58rem;letter-spacing:.14em;background:var(--coral-ink);color:#F4F2EC;border-radius:99px;padding:2px 8px;margin-right:6px;vertical-align:2px;box-shadow:0 0 14px 2px rgba(255,117,89,.45)}
.items{list-style:none;margin:0 0 10px;padding:0 0 0 2.2rem;display:none}
.les.open .items{display:block}
.items li button{width:100%;text-align:left;background:none;border:0;padding:6px 6px;border-radius:6px;display:flex;gap:8px;align-items:center;font-size:.9rem}
.items li button:hover{background:var(--veil)}
.items li button[aria-current="true"]{background:var(--veil);font-weight:600}
.items li.soon{font-size:.85rem;color:var(--muted);padding:5px 6px}
.dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;font-size:10px}
.dot.done{background:var(--ok);border-color:var(--ok);color:var(--bg)}

main{min-width:0}
.crumb{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--coral-ink)}
h1{font-family:var(--display);font-weight:600;font-size:clamp(2rem,4.6vw,3rem);line-height:1.05;margin:6px 0 6px;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:1.65rem;line-height:1.15;margin:34px 0 8px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 18px;max-width:65ch}
.donebadge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ok);background:var(--ok-soft);border-radius:99px;padding:3px 10px;margin-left:8px;vertical-align:4px}
.player{background:#000;border-radius:8px;overflow:hidden;aspect-ratio:16/9;max-width:100%;position:relative}
.player video{width:100%;height:100%;display:block;background:#000}
.pending{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--surface);color:var(--muted);text-align:center;padding:20px;border:1px dashed var(--line);border-radius:8px}
.pending b{font-family:var(--display);font-size:1.5rem;color:var(--ink)}
.navrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin:14px 0 26px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 16px;font-weight:600;font-size:.92rem}
.btn.primary{background:var(--coral-ink);border-color:var(--coral-ink);color:#F4F2EC}
.btn.okb{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.btn:disabled{opacity:.4;cursor:default}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:.82rem}

.rs{border-top:2px solid var(--ink);margin-top:6px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.tabs button{border:0;background:none;padding:7px 12px;border-radius:99px;font-weight:600;font-size:.9rem;color:var(--muted);display:inline-flex;gap:5px;align-items:center}
.tabs button .tk{color:var(--ok);font-size:.8rem}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tabs button[aria-selected="true"] .tk{color:var(--bg)}
.tabs .rsct{margin-left:auto;font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-right:4px}
.pane{padding:18px 0;max-width:68ch}
.k{font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--coral-ink);margin:0 0 6px}
blockquote{font-family:var(--display);font-size:1.6rem;line-height:1.25;margin:4px 0 6px;font-weight:500}
.src{font-size:.82rem;color:var(--muted);margin:0 0 16px}
.ref{display:inline-flex;align-items:center;gap:6px;background:var(--veil);border:1px solid var(--line);border-radius:99px;padding:2px 10px 2px 4px;font-size:.8rem;color:var(--ink);text-align:left;line-height:1.35}
.ref img{width:16px;height:22px;object-fit:cover;border-radius:2px;flex:0 0 auto}
.ref:hover{border-color:var(--coral)}
.ref .i{font-family:var(--mono);font-size:.62rem;color:var(--coral-ink);border:1px solid currentColor;border-radius:50%;width:15px;height:15px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.q{font-family:var(--display);font-size:1.4rem;line-height:1.3;margin:2px 0 4px;font-weight:600}
ol.steps{padding-left:1.3em;margin:6px 0 14px} ol.steps li{margin:4px 0}
textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);padding:10px 12px;font:inherit;resize:vertical}
.saved{font-size:.78rem;color:var(--muted);margin-top:4px;min-height:1em}
.six{font-family:var(--display);font-style:italic;font-size:1.35rem}
.note{background:var(--veil);border-left:3px solid var(--coral);padding:12px 14px;border-radius:0 6px 6px 0;margin:16px 0;font-size:.92rem}
.wb{display:inline-flex;gap:8px;align-items:center;margin-top:8px}
.seq{list-style:none;padding:0;margin:0 0 6px;display:flex;flex-wrap:wrap;gap:6px}
.seq li{font-size:.8rem;border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--muted);display:inline-flex;gap:5px;align-items:center}
.seq li.on{border-color:var(--coral);color:var(--ink);font-weight:600}
.seq li.dn{border-color:var(--ok);color:var(--ok)}

/* dashboard */
.dash{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 22px;align-items:center;margin:14px 0 8px}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0);display:flex;align-items:center;justify-content:center;grid-row:span 2}
.ring span{width:76px;height:76px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:1.7rem;font-weight:600}
.dash .big{font-family:var(--display);font-size:1.45rem;font-weight:600;line-height:1.2}
.dash .meta{color:var(--muted);font-size:.9rem}
.dash .navrow{grid-column:1/-1;margin:8px 0 0}
.home-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .no{font-family:var(--mono);font-size:.7rem;color:var(--coral-ink);letter-spacing:.12em}
.card .nm{font-family:var(--display);font-size:1.45rem;font-weight:600;line-height:1.15}
.card .meta{font-size:.82rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.card .bar{width:100%}
.card.locked{opacity:.55}
.card.bonus{box-shadow:0 0 0 1px var(--coral), 0 0 22px rgba(255,117,89,.28)}
.card.complete{border-color:var(--ok)}
.st{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;border-radius:99px;padding:2px 8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.st.ip{border-color:var(--coral);color:var(--coral-ink)}
.st.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}

/* lesson complete */
.celebrate{text-align:center;max-width:620px;margin:10px auto 0;display:flex;flex-direction:column;align-items:center;gap:10px}
.bigcheck{width:84px;height:84px;border-radius:50%;background:var(--ok);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:2.4rem;animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.bigcheck{animation:none}}
.celebrate .bar{width:min(360px,100%);height:8px}
.donelist{list-style:none;padding:0;margin:6px 0;display:flex;flex-direction:column;gap:4px;text-align:left}
.donelist li{display:flex;gap:8px;align-items:center;font-size:.92rem}

/* start here */
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:10px 0}
.how .card{gap:4px}
.how .card .no{color:var(--muted)}
.how .card b{font-family:var(--display);font-size:1.3rem;line-height:1.15}
.how .card span{font-size:.9rem;color:var(--muted)}
.rs6{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.rs6 div{border-top:2px solid var(--ink);padding-top:6px}
.rs6 b{display:block;font-weight:700}
.rs6 span{font-size:.86rem;color:var(--muted)}
dl.gloss{display:grid;grid-template-columns:minmax(9rem,auto) minmax(0,1fr);gap:10px 18px;margin:10px 0;max-width:75ch}
dl.gloss dt{font-weight:700}
dl.gloss dd{margin:0;color:var(--muted)}
.promise{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--coral);border-radius:0 8px 8px 0;padding:16px 18px;margin:12px 0 16px;max-width:70ch}
.promise p{margin:0;font-family:var(--display);font-size:1.35rem;line-height:1.3;font-weight:600}
.promise small{display:block;margin-top:6px;color:var(--muted);font-size:.88rem}
.shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:10px 0}
.book{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:left}
.book img{width:64px;height:90px;object-fit:cover;border-radius:3px;box-shadow:0 1px 0 var(--line)}
.book b{display:block;font-family:var(--display);font-size:1.15rem;line-height:1.15}
.book span{font-size:.8rem;color:var(--muted);display:block}
.book:hover{border-color:var(--coral)}

/* overlays */
.wbv{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.wbv[hidden]{display:none}
.wbv-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);background:var(--bg);
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.wbv-bar b{font-family:var(--display);font-size:1.25rem;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wbv-bar span{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.wbv-pages{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;align-items:center;gap:16px}
.wbv-pages img{display:block;width:100%;max-width:820px;height:auto;aspect-ratio:8.5/11;background:#fff;border:1px solid var(--line);border-radius:4px}
.wbv-note{max-width:820px;font-size:.85rem;color:var(--muted);text-align:center}
.sheetwrap{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheetwrap[hidden]{display:none}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:12px;max-width:520px;width:100%;max-height:100%;overflow:auto;padding:20px;display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px}
.sheet img{width:110px;height:auto;border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.sheet .k{margin:0}
.sheet h3{font-family:var(--display);font-size:1.5rem;line-height:1.1;margin:2px 0 2px}
.sheet .tag{font-style:italic;color:var(--muted);margin:0 0 10px;font-size:.92rem}
.sheet p{margin:0 0 10px;font-size:.93rem}
.sheet .here{background:var(--veil);border-radius:6px;padding:8px 10px;font-size:.86rem}
.sheet .ft{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:12px;font-size:.84rem;color:var(--muted)}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .menu-btn{display:inline-block}
  nav.outline{position:fixed;inset:0 auto 0 0;width:min(86vw,340px);max-height:none;height:100%;background:var(--bg);z-index:40;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 24px max(16px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);transform:translateX(-105%);transition:transform .2s}
  nav.outline.show{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35}
  .home-grid,.how,.shelf{grid-template-columns:1fr}
  .rs6{grid-template-columns:repeat(2,minmax(0,1fr))}
  .toggle span{display:none}
  .brand small{display:none}
  .flag{display:none}
}
@media (max-width:560px){
  .brand{font-size:1.4rem}
  .prog .pl{display:none}
  .prog .bar{width:54px}
  dl.gloss{grid-template-columns:1fr;gap:2px 0}
  dl.gloss dd{margin-bottom:10px}
  .sheet{grid-template-columns:1fr}
  .sheet img{width:90px}
  .dash{grid-template-columns:1fr;justify-items:start}
  .ring{grid-row:auto}
}
@media (prefers-reduced-motion:reduce){nav.outline{transition:none}.bar i{transition:none}}

/* v4: guided Turn sequence, watch-to-unlock, glows */
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,117,89,0)}50%{box-shadow:0 0 0 3px rgba(255,117,89,.28),0 0 18px 2px rgba(255,117,89,.42)}}
.prog{border-color:var(--coral);animation:glow 2.6s ease-in-out infinite}
.prog:hover{background:var(--surface)}
.card.next{border-color:var(--coral);animation:glow 2.6s ease-in-out infinite}
.upnext{align-self:flex-start;font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;background:var(--coral-ink);color:#F4F2EC;border-radius:99px;padding:2px 9px}
.les.next .no{box-shadow:0 0 0 2px var(--coral),0 0 12px rgba(255,117,89,.55);color:var(--coral-ink)}
.btn.glow{animation:glow 2.6s ease-in-out infinite}
.stepper{list-style:none;margin:18px 0 0;padding:0 0 12px;display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin}
.stepper li{flex:0 0 auto}
.stepper button{background:none;border:0;display:flex;align-items:center;gap:7px;padding:6px 10px 6px 6px;border-radius:99px;font-weight:600;font-size:.88rem;color:var(--muted);white-space:nowrap}
.stepper .n{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.7rem;flex:0 0 auto}
.stepper .dn .n{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.stepper .dn{color:var(--ok)}
.stepper .cur{background:var(--ink);color:var(--bg)}
.stepper .cur .n{border-color:var(--bg);color:var(--bg)}
.stepper button:disabled{opacity:.45;cursor:not-allowed}
.stepwrap{padding:20px 0 4px;max-width:70ch}
.stepwrap.wide{max-width:none}

  </dl>
  <h2>Where the ideas live</h2>

}

function player(route,label){

function lockHtml(route,what){

function pieceView(s,i){

    </span></div>`;

/* ---------- the Turn: one guided sequence of seven steps ---------- */
function stepperHtml(code,k){
  const r=reach(code);
  return `<ol class="stepper" id="stepper">${STEPS.map(([key,n],i)=>{
    const d = done(code) || i<r || (i===r && i<k);
    const cls = i===k ? "cur" : d ? "dn" : "";
    return `<li><button class="${cls}" data-step="${i}" ${i<=r?"":"disabled"} aria-current="${i===k?"step":"false"}"><span class="n">${d&&i!==k?"✓":i<=r?i+1:"🔒"}</span><span class="lbl">${n}</span></button></li>`;
  }).join("")}</ol>`;
}
function wbStep(code,i){
  if(!WB[code]) return "";
  const n=RS[i][1];
  return `<div class="wbstep"><span class="wbic" aria-hidden="true"></span><div><b>Workbook page ${i+1} of 6 · ${n}</b>${i===0?"Your answers go in the boxes above. This is the same step as a workbook page, to print or keep.":"Your answers go in the boxes above. This is the same step as a workbook page."}</div><button class="btn" data-wb="${code}" data-page="${i+2}">See page ${i+1}</button></div>`;
}
function box(key,ph){
  const v=store.get("ans:"+key)||"";
  return `<textarea data-ans="${key}" placeholder="${esc(ph)}" aria-label="${esc(ph)}">${esc(v)}</textarea><div class="abar">${MICBTN()?`<button type="button" class="mic" data-mic="${key}" aria-pressed="false"><span class="dotm" aria-hidden="true"></span><span class="ml">${MICLBL()}</span></button>`:""}<span class="saved" data-saved="${key}">${v?"✓ Saved":""}</span></div>`;
}
function stepBody(code,k){
  const c=COURSE.turns[code]; const teacher=$("#teacher").checked;
  const tn = teacher && c.teacher_note ? `<div class="note"><b>Teacher note.</b> ${esc(c.teacher_note)}</div>`:"";
  switch(STEPS[k][0]){
    case "watch": return `${player(code,"Film loading")}<p style="margin-top:14px">${esc(c.watch?.note)}</p>${tn}<div style="margin-top:18px">${PANEL(code,0)}</div><div class="k">At the fork</div><p>Which door would you open? Hold your answer here before he shows you his.</p>${box(code+":fork","Your door, and why")}`;
    case "recall": return `<div class="k">The lesson in one line</div><blockquote>${esc(c.recall?.quote)}</blockquote>${srcLine(c.recall?.source)}<p>${esc(c.recall?.note)}</p><div class="k" style="margin-top:18px">In your words</div><p>Say the lesson the way you would explain it to a friend.</p>${box(code+":words","The lesson, in your words")}`;
    case "reflect": return `<div class="k">Knockout Question</div><p class="q">${esc(c.reflect?.knockout)}</p>${srcLine(c.reflect?.source)}${box(code+":kq","Your answer")}
      <div class="k" style="margin-top:18px">Then</div><p>${esc(c.reflect?.then)}</p>${box(code+":door","Which door, and why")}
      ${c.reflect?.unasked?`<div class="k" style="margin-top:18px">A question to carry · from Unasked</div><p class="q">${esc(c.reflect.unasked.question)}</p>${srcLine(c.reflect.unasked.source)}`:""}`;
    case "relate": return `<div class="k">Your rep</div><ol class="steps">${(c.relate?.steps||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ol>${srcLine(c.relate?.source)}<p>${esc(c.relate?.task)}</p>${box(code+":rep","What happened when you ran it")}`;
    case "refine": return `<div class="k">Six-word story</div><p class="six">${esc(c.refine?.model)}</p>${srcLine(c.refine?.model_source)}<p>${esc(c.refine?.task)}</p>${box(code+":six1","Draft one")}${box(code+":six2","Draft two, a day later")}<div class="k" style="margin-top:18px">What changed between the drafts</div>${box(code+":changed","What changed")}`;
    case "release": return `<div class="k">Stack It</div><p>${esc(c.release?.stack)}</p>${srcLine(c.release?.source)}${box(code+":stack","Your three sentences")}<div class="k" style="margin-top:18px">Pillar check</div><p>${esc(c.release?.pillar)}</p><div class="pills4" role="radiogroup" aria-label="The pillar this Turn strengthened most">${["Coherence","Resonance","Conviction","Legibility"].map(p=>{const on=store.get("ans:"+code+":pillar")===p;return `<button type="button" class="pchip ${on?"on":""}" role="radio" aria-checked="${on}" data-pillar="${code}|${p}">${p}</button>`}).join("")}</div><div class="k" style="margin-top:14px">Where you felt it</div>${box(code+":felt","Where you felt it")}`;
  }
  return "";
}
function finishBody(s,i){
  const code=s.t.code, isDone=done(code), w=watched(code), all=reach(code)>=6, a=ack(code);
  const next=ALL[i+1];
  const nextLbl = next ? (next.l!==s.l ? "Next lesson" : "Next: "+(next.kind==="turn"?next.t.guest:next.title)) : "Finish";
  const item=(ok,t,sm)=>`<li class="${ok?"ok":""}"><span class="ck">${ok?"✓":""}</span><div>${t}${sm?`<small>${sm}</small>`:""}</div></li>`;
  return `<p class="sub">Three things make a Turn complete. The first two check themselves.</p>
  <ul class="checklist">
    ${item(w,"You watched the film")}
    ${item(all,"You worked through all five Rs")}
    <li class="${a?"ok":""}"><label><input type="checkbox" id="ackBox" data-ack="${code}" ${a?"checked":""} ${isDone?"disabled":""}><div>I finished my Five Rs work${WB[code]?", here on the page or in my workbook, printed or PDF":""}.<small>Your answers stay saved here. ${WB[code]?`<button class="linkbtn" data-wb="${code}" data-page="1">Open the whole workbook</button>`:""}</small></div></label></li>
  </ul>
  ${PDF[code]?`<div class="keep"><b>Your workbook for this Turn</b><p>Everything you said or typed on the six steps is already filled in on its pages. Save it as a PDF to keep or print. Prefer pen and paper? Print a blank one instead.</p><span class="wbdl"><button type="button" class="btn primary" data-mywb="${code}">Save my answers as a PDF</button><a class="btn" href="${PDF[code]}" download>Print a blank workbook</a></span></div>`:""}
  <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <button class="btn big ${isDone?"okb":"primary"} ${a&&!isDone?"glow":""}" id="doneBtn" data-done="${code}" ${next?`data-next="${next.route}"`:""} ${(w&&all&&a)||isDone?"":"disabled"}>${isDone?"Turn complete ✓ · "+nextLbl:"Mark Turn complete"}</button>
    ${!isDone&&!a?'<span class="src" style="margin:0">Tick the box above to unlock.</span>':""}
    ${isDone?`<button class="linkbtn" data-undo="${code}">Mark as not complete</button>`:""}
  </div>`;
}
function turnStep(s,i){
  const code=s.t.code, k=curStep(code), r=reach(code);
  const [key,name,sub]=STEPS[k];
  const body = key==="finish" ? finishBody(s,i) : stepBody(code,k);
  let nav="";
  if(key!=="finish"){
    const nxt=STEPS[k+1][1], locked = key==="watch" && !watched(code);
    nav=`<div class="stepnav"><button class="btn" ${k>0?`data-step="${k-1}"`:(ALL[i-1]?`data-route="${ALL[i-1].route}"`:"disabled")}>${k>0?"Back: "+STEPS[k-1][1]:"Previous piece"}</button>
      <span style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">${locked?lockHtml(code,"film"):""}
      <button class="btn big primary ${locked?"":"glow"}" id="stepNext" data-step="${k+1}" data-adv="1" ${locked?"disabled":""}>Next: ${nxt} →</button></span></div>`;
  } else nav=`<div class="stepnav"><button class="btn" data-step="${k-1}">Back: Release</button></div>`;
  return `<div class="stepwrap ${key==="watch"?"wide":""}" id="stepwrap"><div class="stephead"><span class="sn">STEP ${k+1} OF 7</span><h2>${name}</h2></div>${key!=="finish"&&key!=="watch"?PANEL(code,k):""}${body}${nav}</div>`;
}
function turnView(s,i){
  const t=s.t, c=COURSE.turns[t.code];
  return `<div class="crumb">${label(s.l)} · Turn ${t.turn} · ${esc(s.l.name)}</div>
  <h1>${esc(t.guest)}${done(t.code)?'<span class="donebadge">✓ Complete</span>':""}</h1>
  <p class="sub">${esc(c.recall?.note||"")}</p>
  ${stepperHtml(t.code,curStep(t.code))}
  <div id="turnbody">${turnStep(s,i)}</div>`;
}
function setStep(s,i,k,adv){
  stopMic();
  const code=s.t.code;
  if(adv && k>reach(code)) store.set("reach:"+code,String(k));
  if(k>reach(code)) return;
  store.set("step:"+code,String(k));
  $("#stepper").outerHTML=stepperHtml(code,k);
  $("#turnbody").innerHTML=turnStep(s,i);
  attachVideo();
  const h=$(".stephead"); if(h) h.scrollIntoView({block:"start",behavior:"smooth"});
}

function lessonDoneView(l){
  const c=courseStats(), seq=seqFor(l);
  const idx=LESSONS.indexOf(l); const todo=x=>!x.start&&seqFor(x).length&&!lessonState(x).complete; const nl=LESSONS.find(todo);
  const nxt = nl ? (seqFor(nl).find(s=>!done(s.route))||seqFor(nl)[0]) : null;
  const all = c.d===c.n;
  const later=l.turns.length-built(l).length;
  return `<div class="celebrate">
    <div class="bigcheck" aria-hidden="true">✓</div>
    <div class="crumb">${esc(all?"Free preview complete":label(l)+" complete")}</div>
    <h1>${esc(l.name)}</h1>
    ${l.pillar?`<p class="sub" style="margin:0">This lesson built <b>${esc(l.pillar)}</b>.</p>`:""}
    <ul class="donelist">${seq.map(s=>`<li><span class="dot done">✓</span>${esc(s.title)}</li>`).join("")}</ul>
    ${later?`<p class="src" style="margin:0">That was the free preview of this lesson. The full lesson has ${later} more Turn${later>1?"s":""}.</p>`:""}
    <span class="bar" aria-hidden="true"><i style="width:${c.pct}%"></i></span>
    <div class="meta" style="color:var(--muted)">Your course: <b style="color:var(--ink)">${c.pct}%</b> · ${c.lc} of ${c.ln} lessons complete</div>
    <div class="navrow" style="justify-content:center">
      ${nxt?`<button class="btn primary big glow" data-route="${nxt.route}">Next · ${esc(label(nl))}: ${esc(nl.name)}</button>`:""}
      <button class="btn" data-home="1">See your course</button>
    </div>${nxt?"":waysHtml(true)}

let CUR=null, CURI=-1;
function go(route){ if(location.hash.slice(1)!==route){ location.hash=route } else render() }
function render(){
  if(!done("start") && ALL.some(s=>!s.l.start && done(s.route))) store.set("done:start","1");
  renderProg();
  const r=location.hash.slice(1); const m=$("#main");
  const dm=r.match(/^([lb]\d\d)-done$/);
  if(dm){ const l=LESSONS.find(x=>lessonId(x)===dm[1]); renderOutline(null); if(l&&lessonState(l).complete){ CUR=null; m.innerHTML=lessonDoneView(l); window.scrollTo({top:0}); return } }
  const i=ALL.findIndex(s=>s.route===r); const s=ALL[i]; CUR=s; CURI=i;
  renderOutline(s);
  if(!s){ m.innerHTML=home(); window.scrollTo({top:0}); return }
  let h="";
  if(s.kind==="start"){
    const next=ALL[i+1];
    h+=startView();
  } else {
    const seq=seqFor(s.l);
    h+=`<ul class="seq">${seq.map(x=>`<li class="${x.route===s.route?"on":""} ${done(x.route)?"dn":""}">${done(x.route)?"✓ ":""}${esc(x.kind==="turn"?"Turn "+x.t.turn:x.title)}</li>`).join("")}</ul>`;
    h+= s.kind==="turn" ? turnView(s,i) : pieceView(s,i);
  }
  m.innerHTML=h; window.scrollTo({top:0}); attachVideo(); afterRender(s);
}

/* track real viewing: only continuous playback counts, so skipping ahead doesn't unlock */
function attachVideo(){
  const v=$("#vid"); if(!v) return; const r=v.dataset.route; let last=0;
  const upd=()=>{
    const d=v.duration; if(!d||!isFinite(d)) return;
    const t=v.currentTime;
    if(t>=last && t-last<2.5){ const f=Math.max(watchedFrac(r), t/d); store.set("w:"+r,String(f)) }
    last=t; refreshLock(r);
  };
  v.addEventListener("timeupdate",upd);
  v.addEventListener("seeked",()=>{ last=v.currentTime });
  v.addEventListener("ended",()=>{ store.set("w:"+r,"1"); refreshLock(r) });
}
let unlockedShown={};
function refreshLock(r){
  const f=Math.min(1,watchedFrac(r)/WATCH_DONE), lm=$("#lockmsg");
  if(lm && f<1){ lm.querySelector(".bar i").style.width=Math.round(f*100)+"%"; lm.querySelector("b").textContent=Math.round(f*100)+"%"; return }
  if(watched(r) && !unlockedShown[r] && lm){
    unlockedShown[r]=1; lm.remove();
    const b=$("#stepNext")||$("#doneBtn"); if(b){ b.disabled=false; b.classList.add("glow") }
    toast("Unlocked. "+(CUR&&CUR.kind==="turn"?"On to Recall when you're ready.":"Mark it complete when you're ready."));
  }
}
let toastT; function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600) }

function complete(b){
  const r=b.dataset.done; const s=ALL.find(x=>x.route===r); if(!s) return;
  const was=lessonState(s.l).complete;
  store.set("done:"+r,"1");
  b.classList.add("flash"); b.disabled=true;
  b.textContent = s.kind==="turn" ? "✓ Turn complete" : s.kind==="start" ? "✓ Ready" : "✓ Complete";
  renderProg(); renderOutline(s);
  const nowDone=lessonState(s.l).complete;
  if(!s.l.start) toast(s.kind==="turn" ? `${s.t.guest} complete · your course is now ${courseStats().pct}%` : `${s.title} complete · your course is now ${courseStats().pct}%`);
  setTimeout(()=>{
    if(!s.l.start && !was && nowDone){ go(lessonId(s.l)+"-done"); return }
    if(b.dataset.next) go(b.dataset.next); else { location.hash=""; render() }
  },1100);
}
